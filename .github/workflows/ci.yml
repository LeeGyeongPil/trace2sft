# No keys or network needed: all tests run on local fixtures.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly, to catch breakage from runtime or dependency changes
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run gen:otlp && node --test test/otlp.test.mjs
      - run: node examples/library.mjs
      - run: npm pack --dry-run
